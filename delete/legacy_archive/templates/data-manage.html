<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据管理</title>
  <script type="text/javascript" src="/static/jsscripts/vue.js"></script>
  <script type="text/javascript" src="/static/jsscripts/axios.js"></script>
  <script type="text/javascript" src="/static/jsscripts/elementui/lib-master/index.js"></script>
  <link rel="stylesheet" href="/static/jsscripts/elementui/lib-master/theme-chalk/index.css">
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background-color: #f5f7fa;
    }
    
    .page-container {
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.05);
      padding: 20px;
    }
    
    .page-header {
      margin-bottom: 20px;
      border-bottom: 1px solid #ebeef5;
      padding-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .page-title {
      font-size: 18px;
      color: #303133;
      font-weight: 600;
      margin: 0;
    }
    
    .content-section {
      margin-bottom: 30px;
    }
    
    .section-title {
      font-size: 16px;
      color: #606266;
      margin-bottom: 15px;
      font-weight: 500;
    }
    
    /* 表格样式增强 */
    .el-table {
      margin-top: 15px;
    }
    
    /* 操作按钮组 */
    .operation-group {
      display: flex;
      gap: 10px;
    }

    /* 新增样式：选中行加粗显示 */
    .selected-row {
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="app" v-cloak>
    <div class="page-container">
      <div class="page-header">
        <h2 class="page-title">数据管理</h2>
      </div>
      
      <div id="data-manage">
        <div
          style="display: flex; width: calc(100% - 2rem); flex-direction: row;  padding: 0.5rem 0;"
        >
          <el-button-group>
            <el-button type="success" plain size="mini" @click="openDialog(pageSize - 2, 'create')">导入数据</el-button>
            <el-button type="primary" plain size="mini" @click="openExportDialog">导出数据</el-button>
            <el-button type="warning" plain size="mini" @click="delPage">删除本页数据</el-button>
          </el-button-group>
        </div>
    
        <el-form
          :inline="true"
          :model="searchBox"
          label-width="100px"
          size="mini"
          label-position="top"
          style="display: flex; justify-content: space-around; align-items: center; width: 100%;"
        >
        </el-form>
    
        <el-table
          :data="tableDataShow"
          size="small"
          :max-height="500"
          style="padding: 0.5rem 1rem;"
        >
          <el-table-column label="序号" :show-overflow-tooltip="true" :width="160">
            <template slot-scope="scope">
              <span>{{ showId[(currentPage - 1) * pageSize + scope.$index] + 1 }}</span>
            </template>
          </el-table-column>
          <el-table-column label="数据名称" :show-overflow-tooltip="true" prop="dataName"></el-table-column>
          <el-table-column label="数据描述" :show-overflow-tooltip="true" prop="dataDescript"></el-table-column>
          <el-table-column label="数据类型" :show-overflow-tooltip="true" prop="dataType"></el-table-column>
    
          <el-table-column label="操作">
            <template slot-scope="scope">
              <el-button
                icon="el-icon-view"
                type="info"
                size="mini"
                title="查看数据"
                plain
                circle
                @click="viewData(scope.row.dataName, scope.row.dataType)">
              </el-button>
    
              <el-button
                icon="el-icon-edit"
                type="primary"
                size="mini"
                title="编辑数据"
                plain
                circle
                @click="openDialog(scope.$index, 'edit')">
              </el-button>
    
              <el-button
                icon="el-icon-delete"
                type="danger"
                size="mini"
                title="删除数据"
                plain
                circle
                @click="delLine(scope.$index)"
              ></el-button>
            </template>
          </el-table-column>
        </el-table>
    
        <el-pagination
          @current-change="handleCurrentChange"
          :current-page="currentPage"
          :page-size="pageSize"
          layout="total, prev, pager, next, jumper"
          :total="showId.length"
          v-if="showId.length > pageSize"
        ></el-pagination>
        
        
        <el-dialog
          :title="dialogTitle"
          :visible.sync="dialogVisible"
        >
          <el-form
            :model="dataForm"
            label-width="100px"
            size="mini"
            label-position="right"
          >
            <el-form-item label="导入数据">
              <el-input v-model="dataForm.dataName" disabled></el-input>
              <el-button @click='importData'>选择文件</el-button>
            </el-form-item>
    
            <el-form-item label="数据描述" prop="dataDescript">
              <el-input v-model="dataForm.dataDescript" placeholder="请输入数据描述" clearable></el-input>
            </el-form-item>
    
            <el-form-item label="数据类型">
              <el-select v-model="dataForm.dataType" placeholder="请选择数据类型" clearable filterable default-first-option>
                <el-option
                  v-for="(typeVal,index) in colConfig[2].options"
                  :key="index"
                  :label="typeVal"
                  :value="typeVal"
                ></el-option>
              </el-select>
            </el-form-item>
          </el-form>
          <span slot="footer" class="dialog-footer">
            <el-button @click="closeDialog">取 消</el-button>
            <el-button type="primary" @click="dialogFormUpdate">确 定</el-button>
          </span>
        </el-dialog>
    
        <!-- 导出数据对话框 -->
        <el-dialog
          title="选择要导出的文件"
          :visible.sync="exportDialogVisible"
          width="500px"
        >
          <el-tabs v-model="activeTab">
            <el-tab-pane label="训练数据" name="traindata">
              <el-table :data="trainFiles" height="300" @row-click="selectFile" :row-class-name="rowClassName">
                <el-table-column prop="name" label="文件名"></el-table-column>
              </el-table>
            </el-tab-pane>
            <el-tab-pane label="测试数据" name="testdata">
              <el-table :data="testFiles" height="300" @row-click="selectFile" :row-class-name="rowClassName">
                <el-table-column prop="name" label="文件名"></el-table-column>
              </el-table>
            </el-tab-pane>
          </el-tabs>
          <span slot="footer" class="dialog-footer">
            <el-button @click="closeExportDialog">取消</el-button>
            <el-button type="primary" @click="downloadFile">下载</el-button>
          </span>
        </el-dialog>
    
      </div>
    </div>
  </div>
</body>

<script type="text/javascript">
  var vm = new Vue({
    el: "#data-manage",
    data() {
      return {
        showId: [],
        searchBox: {
          dataName: "",
          dataDescript: "",
          dataType:"",
        },
        currentPage: 1,
        checkPass: true,
        pageSize: 10,

        dialogVisible: false,
        editMode: "create",
        editIndex: 0,
        
        dataForm: {
          dataName: "",
          dataDescript: "",
          dataType:"",
          file:"",
        },

        tableData: [],
        newDataLoaded: 0,
        colConfig: [
          {//0
            name: "数据名称",
            key: "dataName",
            options: {},
            placeholder: "请输入数据名称",
          },
          {
            name: "数据描述",
            key: "dataDescript",
            placeholder: "请输入数据描述",
          },
          {
            name: "数据类型",
            key:"dataType",
            options:{"训练数据":"训练数据","测试数据":"测试数据"},
            placeholder:"请选择数据类型",

          }
        ],

        dataLoad: false,

        // 导出数据相关
        exportDialogVisible: false,
        activeTab: "traindata",
        trainFiles: [],
        testFiles: [],
        selectedFile: null,
      }
    },
    computed: {
      dataShowInfo () {
        return this.showId.map((itm) =>
          this.tableData[itm]
        );
      },
      tableDataShow () {
        return this.dataShowInfo.slice(
          (this.currentPage - 1) * this.pageSize,
          this.currentPage * this.pageSize,
        );
      },
      dialogTitle () {
        return this.editMode === "create" ? "新增条目" : "编辑条目";
      },
    },
    created() {
      axios.post("/data-manage/init-all-data")
        .then(res => {
          this.dataInit(res.data);
          this.$forceUpdate();
        })
        .catch(err => { });

      this.searchConfigInit();
    },
    watch: {
      dataLoad (newVal) {
        if (newVal) {
          this.searchConfigInit();
          this.dataLoad = false;
        }
      }
    },
    methods: {
      dataInit(val){
        this.tableData = val;
        this.showId = this.tableData.map((itm,itmId)=>itmId);
        this.dataLoad = true;
      },
      dataUpdate (val) {
        this.tableData = val;
        this.showId = this.tableData.map((itm,itmId)=>itmId);
        this.dataLoad = true;

        let formData = new FormData();
        formData.append("tableData", JSON.stringify(this.tableData));
        axios.post("/data-manage/update",formData)
        .then(res => {})
        .catch(err => { 
          this.$message.error('数据更新失败')
        });
      },
      addNewData(val){
        let formData = new FormData();
        formData.append("newData", JSON.stringify(val));

        axios.post("/data-manage/add-new-data",formData)
        .then(res => {
          this.tableData = res.data
        })
        .catch(err => { 
          this.$message.error('数据读取失败')
        });
      },
      setDefault(val, val_default){
        if (val === null || val === undefined){
          return val_default;
        } else {
          return val;
        }
      },
      importFile(innerFunc){
        const input = document.createElement('input');
        input.setAttribute('type', 'file');
        input.setAttribute('accept', '.csv');
        input.onchange = () => {
          const file = input.files[0];
          if (file) {
            let formData = new FormData();
            formData.append("file",file);
            axios.post("/data-manage/load-new-data",formData)
            .then(res => {
              this.newDataLoaded = 1;
              // 将dataForm.dataName设为文件原名
              this.dataForm.dataName = file.name;
            })
            .catch(err => { 
              this.$message.error('数据读取失败')
            });
          } else {
            this.$message.error("未上传配置文件")
          }
        }
        input.click();
      },
      searchConfigInit() {
        this.colConfig.forEach((itm) => {
          if (this.setDefault(itm.searchable, true)) {
            if (itm.multiple) {
              this.searchBox[itm.key] = [];
            } else if (["select", "switch"].includes(itm.inputType)) {
              this.searchBox[itm.key] = "all";
            } else {
              this.searchBox[itm.key] = "";
            }
          }
        });
      },
      openDialog(index, mode) {
        this.editIndex = this.getLineIndex(index);
        this.editMode = mode;
        if (mode === "edit") {
          this.dataForm = JSON.parse(JSON.stringify(this.tableData[this.getLineIndex(index)]));
        } else {
          this.dataForm = this.lineInit();
        }
        this.dialogVisible = true;
      },
      closeDialog() {
        this.dialogVisible = false;
      },
      dialogFormUpdate() {
        let tableData = Array.isArray(this.tableData) ? [...this.tableData] : [];

        if (this.editMode === "edit") {
          tableData[this.showId[this.editIndex]] = this.dataForm;
          this.dataUpdate(tableData);
        } else {
          this.addLine(this.editIndex, this.dataForm);
        }
        this.dialogVisible = false;
      },
      lineInit() {
        let defaultLine = {};
        this.colConfig.forEach((itm) => {
          if (itm.multiple) {
            defaultLine[itm.key] = [];
          } else if (itm.inputType == "select") {
            defaultLine[itm.key] = itm.default || "";
          } else if (itm.inputType == "switch") {
            defaultLine[itm.key] = itm.default || false;
          } else {
            defaultLine[itm.key] = itm.default || "";
          }
        });
        defaultLine.editable = true;
        return defaultLine;
      },
      arrFullIn(a, b) {
        return b.findIndex((itm) => !a.includes(itm)) == -1;
      },
      arrPartialIn(a, b) {
        return b.findIndex((itm) => a.includes(itm)) != -1;
      },
      handleCurrentChange(currentPage) {
        this.currentPage = Math.max(1, currentPage);
      },
      
      getLineIndex (index) {
        return Math.min(
          (this.currentPage - 1) * this.pageSize + index,
          this.showId.length - 1,
        )
      },
      addEditable(dataLine) {
        let dataLine_ = JSON.parse(JSON.stringify(dataLine));
        dataLine_.editable = dataLine_.editable || false;
        return dataLine_;
      },
      addLine(index, newData) {
        if (this.newDataLoaded == 0){
          this.$message.error('未导入数据文件')
        } else {
          this.newDataLoaded = 0;
          let ind = index;
          if (this.showId.length <= index) {
            if (this.showId.length) {
              ind = this.showId.length - 1;
            } else {
              ind = -1;
            }
          }
          let indTrue = -1;
          if (ind !== -1) {
            indTrue = this.showId[ind];
          }
          
          this.showId = this.showId.map((_, sId) =>
            sId > ind ? this.showId[sId] + 1 : this.showId[sId]
          );
          this.showId.splice(ind + 1, 0, indTrue + 1);
          this.checkPass = false;

          this.addNewData(newData);
        }
      },
      delLine(_index) {
        const index = this.getLineIndex(_index);
        let tableData = [...this.tableData];
        tableData.splice(this.showId[index], 1);
        this.showId = this.showId.map((_, sId) =>
          sId > index ? this.showId[sId] - 1 : this.showId[sId]
        );
        this.showId.splice(index, 1);
        this.dataUpdate(tableData);
      },
      importData() {
        this.importFile();
      },

      // 打开导出数据对话框
      openExportDialog() {
        this.exportDialogVisible = true;
        axios.get("/data-manage/list-files")
          .then(res => {
            this.trainFiles = (res.data.traindata || []).map(name => ({ name }));
            this.testFiles = (res.data.testdata || []).map(name => ({ name }));
          })
          .catch(err => {
            this.$message.error("获取文件列表失败");
          });
      },
      closeExportDialog() {
        this.exportDialogVisible = false;
        this.selectedFile = null;
      },
      selectFile(row) {
        this.selectedFile = row.name;
      },
      downloadFile() {
        if (!this.selectedFile) {
          this.$message.warning("请选择文件后再下载");
          return;
        }
        let filePath;
        if (this.activeTab === "traindata") {
          filePath = `static/data/traindata/${this.selectedFile}`;
        } else {
          filePath = `static/data/testdata/${this.selectedFile}`;
        }

        axios.post("/data-manage/download-file", { filePath }, { responseType: "blob" })
          .then(response => {
            const blob = new Blob([response.data]);
            const link = document.createElement("a");
            link.href = window.URL.createObjectURL(blob);
            link.download = this.selectedFile;
            link.click();
            this.closeExportDialog();
          })
          .catch(err => {
            this.$message.error("下载文件失败");
          });
      },
      rowClassName({row, rowIndex}) {
        // 如果当前行的文件名等于selectedFile，则加上selected-row类
        if (this.selectedFile === row.name) {
          return 'selected-row';
        }
        return '';
      },

      exportData() {
        // 已重写功能，不再使用旧的导出逻辑
      },

      delPage() {
        let tableData = [...this.tableData];
        this.showId
          .slice(
            (this.currentPage - 1) * this.pageSize,
            this.currentPage * this.pageSize
          )
          .forEach((ind, count) => {
            let index = ind - count;
            tableData.splice(this.dataShowInfo[index], 1);
            this.showId = this.showId.map((_, sId) =>
              sId > index ? this.showId[sId] - 1 : this.showId[sId]
            );
            this.showId.splice(index, 1);
          });
        this.dataUpdate(tableData);
      },
      clearAll() {
        this.dataUpdate([]);
        this.$nextTick(() => {
          this.searchConfigInit();
          this.filterSearch();
        });
      },
      configRule() {
        const formData = new FormData();
        formData.append("colConfig", JSON.stringify(this.colConfig));
        formData.append("tableData", JSON.stringify(this.tableData));
        formData.append("obj", this.obj);

        axios.post(
          "/rule-edit/config-rule",
          formData
        ).then(response => {
          this.$message.success("成功");
        }).catch(error => {
          this.$message.error("规则配置失败");
        });
      },
      viewData(fileName, dataType) {
        window.location.href = '/data-view?file_name=' + encodeURIComponent(fileName) + '&data_type=' + encodeURIComponent(dataType);
      }
    },
  })
</script>
</html>
