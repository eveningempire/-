    .msfg-placeholder {

      border: 2px dashed #ddd;

      color: #409EFF;
    }
    .msfg-placeholder p {

<script>
  var vm = new Vue({
    el: "#msfg-panel",
    data: {
      obj: 'cmg',
    },
    components: {
      'ate-multi-signal-flow-graph': window.msfgComp || {
        template: '<div class="msfg-placeholder"><h3>多信号流图编辑器</h3><p>组件加载失败，请检查JavaScript文件</p></div>'
      },

    }
